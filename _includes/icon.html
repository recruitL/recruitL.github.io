{% assign icon_id = include.id | default: "link" %}
<svg width="{{ include.width | default: "16" }}" height="{{ include.height | default: "16" }}" class="icon icon--{{ icon_id }}"{% if include.decorative %} aria-hidden="true" focusable="false"{% else %} role="img" aria-label="{{ include.title | default: icon_id | escape }}"{% endif %}><use href="#{{ icon_id }}" xlink:href="#{{ icon_id }}" fill="{{ include.color | default: 'CurrentColor' }}"></use></svg>
