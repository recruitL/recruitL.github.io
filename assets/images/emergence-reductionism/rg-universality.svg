<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">重整化群流与普适性</title>
  <desc id="desc">同一吸引域中的不同微观模型，经多次粗粒化后流向同一个红外固定点，微观细节成为不相关方向。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#49645f"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b85f36"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f7f4ed"/>
  <text x="600" y="55" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="30" font-weight="700">RG 如何把“多种微观”变成“同一种宏观”</text>
  <text x="600" y="88" text-anchor="middle" fill="#526964" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">每一步都积分掉短尺度涨落，并重新缩放自由度与耦合常数</text>

  <text x="174" y="138" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="21" font-weight="700">UV：不同微观实现</text>
  <text x="600" y="138" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="21" font-weight="700">粗粒化与重标度</text>
  <text x="1006" y="138" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="21" font-weight="700">IR：同一普适类</text>

  <g filter="url(#shadow)">
    <rect x="50" y="180" width="248" height="90" rx="20" fill="#e8f3f0" stroke="#177f75" stroke-width="2.5"/>
    <rect x="50" y="310" width="248" height="90" rx="20" fill="#fff0e7" stroke="#b85f36" stroke-width="2.5"/>
    <rect x="50" y="440" width="248" height="90" rx="20" fill="#ececf8" stroke="#5f62a9" stroke-width="2.5"/>
  </g>
  <text x="174" y="216" text-anchor="middle" fill="#0d4f49" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="700">晶格磁体</text>
  <text x="174" y="246" text-anchor="middle" fill="#36514c" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16">局域自旋与交换耦合</text>
  <text x="174" y="346" text-anchor="middle" fill="#74381e" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="700">液体—气体</text>
  <text x="174" y="376" text-anchor="middle" fill="#604538" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16">分子势与密度涨落</text>
  <text x="174" y="476" text-anchor="middle" fill="#383b7d" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="700">二元混合物</text>
  <text x="174" y="506" text-anchor="middle" fill="#494b72" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16">不同组分与局域细节</text>

  <g fill="none" stroke="#49645f" stroke-width="4" marker-end="url(#arrow)">
    <path d="M298 225 C400 225 420 300 506 330"/>
    <path d="M298 355 C410 355 438 355 506 355"/>
    <path d="M298 485 C400 485 420 410 506 380"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="506" y="260" width="188" height="190" rx="94" fill="#ffffff" stroke="#809b95" stroke-width="3"/>
  </g>
  <path d="M552 350 C552 300 648 300 648 350 C648 400 552 400 552 350" fill="none" stroke="#177f75" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="600" y="340" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700">重复 RG</text>
  <text x="600" y="368" text-anchor="middle" fill="#526964" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="15">Λ → Λ / b</text>

  <path d="M694 355 H842" fill="none" stroke="#b85f36" stroke-width="5" marker-end="url(#arrowAccent)"/>
  <g filter="url(#shadow)">
    <circle cx="984" cy="355" r="126" fill="#102033"/>
  </g>
  <circle cx="984" cy="355" r="64" fill="none" stroke="#d8e8e4" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="984" cy="355" r="17" fill="#f2b56b"/>
  <text x="984" y="281" text-anchor="middle" fill="#ffffff" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="23" font-weight="700">IR 固定点</text>
  <text x="984" y="407" text-anchor="middle" fill="#dce9e6" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">相同临界指数</text>
  <text x="984" y="435" text-anchor="middle" fill="#dce9e6" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">相同缩放函数</text>

  <path d="M808 211 C855 169 914 176 946 236" fill="none" stroke="#b85f36" stroke-width="3" stroke-linecap="round"/>
  <text x="730" y="168" fill="#74381e" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">相关方向</text>
  <text x="730" y="193" fill="#604538" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="15">决定偏离临界点的少数参数</text>

  <path d="M936 452 C850 520 752 520 716 474" fill="none" stroke="#177f75" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"/>
  <text x="710" y="544" fill="#0d4f49" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17" font-weight="700">不相关方向</text>
  <text x="710" y="569" fill="#36514c" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="15">微观差异随尺度放大而衰减</text>

  <rect x="87" y="626" width="1026" height="84" rx="20" fill="#ffffff" stroke="#9eb2ad" stroke-width="2"/>
  <text x="600" y="660" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700">多对一映射带来宏观自主性：IR 行为通常不能唯一反推出 UV 细节</text>
  <text x="600" y="689" text-anchor="middle" fill="#526964" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16">限定：只有位于同一吸引域、满足相应维数/对称性/相互作用条件的模型才会汇聚</text>
</svg>
