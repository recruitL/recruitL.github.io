<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">还原、演绎与层展对应三个不同问题</title>
  <desc id="desc">微观理论分别通向本体论还原、演绎与构造、层展与涌现三个问题，底部汇合为现代物理的组合立场。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49645f"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#f7f4ed"/>
  <text x="600" y="54" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="30" font-weight="700">不是“三选一”，而是三个不同问题</text>

  <g filter="url(#shadow)">
    <rect x="425" y="84" width="350" height="102" rx="24" fill="#102033"/>
  </g>
  <text x="600" y="126" text-anchor="middle" fill="#ffffff" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="25" font-weight="700">微观理论</text>
  <text x="600" y="158" text-anchor="middle" fill="#dce9e6" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="18">自由度 · 相互作用 · 动力学</text>

  <path d="M600 186 V218 H202 V250" fill="none" stroke="#49645f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 186 V250" fill="none" stroke="#49645f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 218 H998 V250" fill="none" stroke="#49645f" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="58" y="260" width="288" height="266" rx="24" fill="#e8f3f0" stroke="#177f75" stroke-width="3"/>
    <rect x="456" y="260" width="288" height="266" rx="24" fill="#fff0e7" stroke="#b85f36" stroke-width="3"/>
    <rect x="854" y="260" width="288" height="266" rx="24" fill="#ececf8" stroke="#5f62a9" stroke-width="3"/>
  </g>

  <circle cx="202" cy="310" r="26" fill="#177f75"/>
  <text x="202" y="318" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700">1</text>
  <text x="202" y="365" text-anchor="middle" fill="#0d4f49" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="25" font-weight="700">本体论还原</text>
  <text x="202" y="412" text-anchor="middle" fill="#203c38" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">宏观对象由什么构成？</text>
  <text x="202" y="442" text-anchor="middle" fill="#203c38" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">是否需要额外的基本实体？</text>
  <rect x="103" y="474" width="198" height="34" rx="17" fill="#c9e5df"/>
  <text x="202" y="497" text-anchor="middle" fill="#0d4f49" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="600">组成 · 依赖 · 约束</text>

  <circle cx="600" cy="310" r="26" fill="#b85f36"/>
  <text x="600" y="318" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700">2</text>
  <text x="600" y="365" text-anchor="middle" fill="#74381e" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="25" font-weight="700">演绎与构造</text>
  <text x="600" y="412" text-anchor="middle" fill="#52382d" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">知道底层规律以后，</text>
  <text x="600" y="442" text-anchor="middle" fill="#52382d" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">能否推出高层规律？</text>
  <rect x="501" y="474" width="198" height="34" rx="17" fill="#f6d7c7"/>
  <text x="600" y="497" text-anchor="middle" fill="#74381e" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="600">桥接 · 近似 · 极限</text>

  <circle cx="998" cy="310" r="26" fill="#5f62a9"/>
  <text x="998" y="318" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700">3</text>
  <text x="998" y="365" text-anchor="middle" fill="#383b7d" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="25" font-weight="700">层展与涌现</text>
  <text x="998" y="412" text-anchor="middle" fill="#3f405e" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">新尺度上，什么结构</text>
  <text x="998" y="442" text-anchor="middle" fill="#3f405e" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="17">与规律获得自主性？</text>
  <rect x="899" y="474" width="198" height="34" rx="17" fill="#d7d7ef"/>
  <text x="998" y="497" text-anchor="middle" fill="#383b7d" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="16" font-weight="600">新变量 · 稳健 · 自主</text>

  <path d="M202 526 V565 H600" fill="none" stroke="#49645f" stroke-width="3"/>
  <path d="M600 526 V565" fill="none" stroke="#49645f" stroke-width="3"/>
  <path d="M998 526 V565 H600" fill="none" stroke="#49645f" stroke-width="3"/>
  <path d="M600 565 V584" fill="none" stroke="#49645f" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="128" y="596" width="944" height="82" rx="22" fill="#ffffff" stroke="#9eb2ad" stroke-width="2"/>
  </g>
  <text x="600" y="630" text-anchor="middle" fill="#102033" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="21" font-weight="700">现代物理的常见组合</text>
  <text x="600" y="659" text-anchor="middle" fill="#36514c" font-family="Inter, Noto Sans SC, PingFang SC, sans-serif" font-size="19">本体依赖 + 推导有条件 + 尺度自主性</text>
</svg>
