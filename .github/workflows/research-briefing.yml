name: Research Briefing

on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: research-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check briefing configuration
        id: config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured; keeping the existing briefing archive."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate research briefing
        if: steps.config.outputs.enabled == 'true'
        run: python scripts/research_briefing.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEARCH_BRIEFING_MODEL: ${{ vars.RESEARCH_BRIEFING_MODEL }}

      - name: Commit briefing
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [ -z "$(git status --porcelain _research_briefings)" ]; then
            echo "No research briefing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _research_briefings
          git commit -m "Update research briefing"
          git push
