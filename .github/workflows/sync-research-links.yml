name: Sync research links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install script dependencies
        run: python -m pip install pyyaml

      - name: Sync research topic data
        run: python scripts/sync_research_links.py

      - name: Generate research pages
        run: python scripts/generate_research_pages.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync research topics from research-links"
          file_pattern: "_data/research_topics.yml research/*/index.md"
